name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
  push:
    branches:
    - master
    - develop
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  rust-server:
    name: Rust server (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Check out repository
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Validate Unix shell syntax
      shell: bash
      run: bash -n compile.sh test.sh publish.sh scripts/*.sh

    - name: Set up Rust 1.85.0 (server)
        # dtolnay/rust-toolchain@1.85.0
      uses: dtolnay/rust-toolchain@98effd2fc0b766278e30ab86762dd5e9a8531399
      with:
        components: clippy

    - name: Report Rust toolchain (server)
      run: |
        rustc --version
        cargo --version

    - name: Cache Rust build (server-rs)
        # actions/cache@v4
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          server-rs/target
        key: cargo-server-${{ runner.os }}-${{ hashFiles('server-rs/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-server-${{ runner.os }}-

      # The Unix wrapper is the release-facing contract: it builds both Rust
      # apps with their lockfiles and copies the shipped binaries into bin/.
      # rcce-client links CPAL's native ALSA backend on Linux, so install its
      # development metadata before exercising that real release path.
    - name: Install Linux audio build dependency
      run: |
        sudo apt-get update
        sudo apt-get install --yes libasound2-dev

    - name: Package Rust apps for Linux
      shell: bash
      run: |
        ./compile.sh -e -t -r
        test -x bin/ClientRS
        test -x bin/ServerRS

    - name: Build + test (server workspace, locked)
      working-directory: server-rs
      run: cargo test --workspace --locked

    - name: Build Rust server Docker image
      run: docker build -f server-rs/Dockerfile -t rcce-server .

    - name: Smoke-test Rust server Docker startup
      shell: bash
      run: |
        set -euo pipefail
        container_name=rcce-server-smoke
        cleanup() {
          docker rm --force "$container_name" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        docker run --detach --name "$container_name" -p 25000:25000/udp -v "$GITHUB_WORKSPACE/data:/data:ro" rcce-server

        ready=false
        for attempt in $(seq 1 30); do
          if docker logs "$container_name" 2>&1 | grep -Fq "Listening on UDP 25000."; then
            ready=true
            break
          fi
          sleep 1
        done

        if [ "$ready" != true ]; then
          echo "Rust server Docker smoke test did not reach UDP readiness"
          docker logs "$container_name" || true
          exit 1
        fi

    - name: Clippy (server workspace, -D warnings)
      working-directory: server-rs
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
